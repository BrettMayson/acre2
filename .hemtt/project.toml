name = "YARD"
mainprefix = "idi"
prefix = "acre"
author = "YARD Team, ACRE2 Team"

[files]
include = [
    "*.dll",
    "*.so",
    "mod.cpp",
    "README.md",
    "LICENSE",
    "yard_logo_medium_ca.paa",
    "meta.cpp",
    "extras/Wav2B64.exe",
    "extras/examples/**",
]

[version]
git_hash = 0

[hemtt.release]
folder = "yard"

[hemtt.launch.default]
workshop = [
    "450814997", # CBA_A3's Workshop ID
    "463939057", # ACE3's Workshop ID
]

[hemtt.launch.cba]
workshop = [
    "450814997", # CBA_A3's Workshop ID
]

[hemtt.launch.vn]
workshop = [
    "450814997", # CBA_A3's Workshop ID
    "463939057", # ACE3's Workshop ID
    "3499977893", # ADT Workshop ID
]
dlc = [
    "S.O.G. Prairie Fire",
]

[signing]
authority = "yard"
