name: Docs

# Builds the documentation (mdBook, docs/) and publishes it to GitHub Pages.
# Pull requests only build it, to catch errors.

on:
  push:
    branches:
    - main
  pull_request:
    paths:
    - 'docs/**'
    - 'addons/api/**'
    - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source code
      uses: actions/checkout@v6
    - name: Install mdBook
      uses: taiki-e/install-action@v2
      with:
        tool: mdbook@0.5
    - name: Generate the Functions List
      run: python3 docs/tools/document_functions.py api --output docs/src/frameworks/functions-list.md
    - name: Build
      run: mdbook build docs
    - name: Upload Pages artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
