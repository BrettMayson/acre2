<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>YARD</title>
  <!-- Badge -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="#3c4a2b"/>

  <g fill="none" stroke="#f2efe4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Signal, broadcast from the mast -->
    <path d="M 211.2 251.8 A 54 54 0 0 0 211.2 312.2" stroke-width="18"/>
    <path d="M 300.8 251.8 A 54 54 0 0 1 300.8 312.2" stroke-width="18"/>
    <path d="M 179.7 230.6 A 92 92 0 0 0 179.7 333.4" stroke-width="18"/>
    <path d="M 332.3 230.6 A 92 92 0 0 1 332.3 333.4" stroke-width="18"/>

    <!-- Y as an antenna: dipole arms and mast -->
    <path d="M 146 100 L 256 236 L 366 100" stroke-width="46"/>
    <path d="M 256 236 L 256 344" stroke-width="46"/>
  </g>

  <!-- Yardstick the mast stands on -->
  <rect x="84" y="352" width="344" height="72" rx="14" fill="#d9a63a"/>
  <g stroke="#3c4a2b" stroke-width="8" stroke-linecap="round">
    <path d="M 127 352 V 396"/>
    <path d="M 170 352 V 378"/>
    <path d="M 213 352 V 396"/>
    <path d="M 299 352 V 396"/>
    <path d="M 342 352 V 378"/>
    <path d="M 385 352 V 396"/>
  </g>
</svg>
